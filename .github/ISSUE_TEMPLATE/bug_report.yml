name: Bug report
description: Report something that is not working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can — logs and reproduction steps help us fix issues faster.

        For Linux graphics or startup problems, run from a terminal and attach the log:
        ```sh
        ./SQLEditor-x86_64.AppImage 2>&1 | tee sqleditor.log
        ```

  - type: dropdown
    id: version
    attributes:
      label: SQLEditor version
      description: Which version are you running?
      options:
        - Latest release
        - Built from source (main branch)
        - Built from source (other branch/commit)
        - Not sure
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit hash or release tag
      description: e.g. `v1.2.0` or `abc1234` — skip if unknown
      placeholder: v1.0.0

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. Ubuntu 24.04, macOS 15.2, Windows 11
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: Database type (if applicable)
      options:
        - SQLite
        - PostgreSQL
        - MySQL / MariaDB
        - MongoDB
        - Redis
        - Microsoft SQL Server
        - Oracle
        - Amazon Redshift
        - Cassandra
        - N/A (not database-related)
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Numbered steps so we can reproduce the issue
      placeholder: |
        1. Connect to PostgreSQL 16
        2. Open SQL Editor
        3. Run `SELECT 1`
        4. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      description: Paste terminal output, crash messages, or attach a log file
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: GPU/driver info (Linux NVIDIA), connection settings (redact passwords), screenshots, etc.
