name: Feature request
description: Suggest an idea or improvement for SQLEditor
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe the problem you are trying to solve, not just the solution you have in mind.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? Who benefits?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you have tried?

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of SQLEditor does this relate to?
      options:
        - SQL Editor
        - Database browser / sidebar
        - Table viewer / editor
        - ER diagram
        - Connection / SSH / SSL
        - AI assistant
        - Export / import
        - Platform-specific (Linux / macOS / Windows)
        - Build / packaging
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, examples from other tools, database types affected, etc.
